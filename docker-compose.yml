services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # minio/minio and minio/mc are no longer pullable from Docker Hub ("pull
    # access denied ... repository does not exist": that is what made the
    # Codespace postCreateCommand fail). bitnamilegacy/* are frozen copies of
    # the last Bitnami builds of the same MinIO server: fine for a trial
    # environment, but they receive no updates and may be removed -- switch
    # to a maintained S3-compatible server before any real deployment.
    # The Bitnami entrypoint wraps its own start script, so it is overridden
    # to run the binary directly (same command line as the official image),
    # as root so the named volume mounted at /data is writable.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    user: "0:0"
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # Port-open check: the Bitnami image is not guaranteed to ship curl.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    user: "0:0"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb --ignore-existing local/${S3_BUCKET};
      mc anonymous set download local/${S3_BUCKET};
      echo 'bucket ready';
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      PYTHONPATH: /app:/workspace:/packages/parsing_rules:/packages/scoring_engine:/packages/sector_dictionaries:/packages/shared_models:/packages/shared_schemas
    volumes:
      - ./apps/api:/app
      - ./packages:/packages
      - ./infra:/workspace/infra
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      PYTHONPATH: /app:/workspace:/packages/parsing_rules:/packages/scoring_engine:/packages/sector_dictionaries:/packages/shared_models:/packages/shared_schemas
    volumes:
      - ./apps/worker:/app
      - ./apps/api/app/domain:/app/app/domain
      - ./packages:/packages
      - ./infra:/workspace/infra
    command: celery -A app.celery_app worker --beat --loglevel=info

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      - api
    env_file: .env
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: npm run dev

volumes:
  db_data:
  minio_data:
